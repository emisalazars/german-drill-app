name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: deutschdrill-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
      # Every build of main becomes the "latest" release, so the phone can download the APK directly:
      # https://github.com/<owner>/<repo>/releases/latest/download/deutsch-drill.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk deutsch-drill.apk
          gh release create "build-${{ github.run_number }}" deutsch-drill.apk \
            --title "Deutsch Drill build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Install deutsch-drill.apk on your phone." \
            --latest
